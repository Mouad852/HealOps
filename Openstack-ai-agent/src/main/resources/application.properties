spring.application.name=Openstack-ai-agent
server.port=8888
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
healops.workflow.auto-orchestrate=true
healops.diagnosis.llm-enabled=${HEALOPS_DIAGNOSIS_LLM_ENABLED:true}
healops.conversation.llm-enabled=${HEALOPS_CONVERSATION_LLM_ENABLED:true}
healops.security.operator-username=${HEALOPS_OPERATOR_USER:operator}
healops.security.operator-password=${HEALOPS_OPERATOR_PASSWORD:operator-local-dev}
healops.security.viewer-username=${HEALOPS_VIEWER_USER:viewer}
healops.security.viewer-password=${HEALOPS_VIEWER_PASSWORD:viewer-local-dev}
healops.evidence.adapter.timeout=PT3S
healops.evidence.adapter.max-response-bytes=32768
healops.remediation.live-adapter-enabled=${HEALOPS_REMEDIATION_LIVE_ADAPTER:true}
healops.remediation.execution-timeout=PT10S
healops.remediation.max-response-bytes=32768
healops.verification.stabilization-delay=${HEALOPS_VERIFICATION_STABILIZATION_DELAY:PT5S}
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite
spring.ai.openai.embedding.options.model=text-embedding-3-small

logging.level.io.modelcontextprotocol=TRACE
logging.level.org.springframework.ai.mcp=TRACE

