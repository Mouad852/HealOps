mcp.server2.url=${MCP_MONITOR_URL}
mcp.server1.url=${MCP_DOCKER_URL}
mcp.server3.url=${MCP_K8S_URL}
mcp.server4.url=${MCP_OPENSTACK_URL}
mcp.trace.url=${MCP_TRACING_URL}
