# Test-only endpoint values keep the Spring context independent of local containers
# and production secrets. No network requests are made while the context loads.
spring.datasource.url=jdbc:h2:mem:healops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
healops.workflow.auto-orchestrate=false
healops.diagnosis.llm-enabled=false
mcp.server1.url=http://localhost:8000
mcp.server2.url=http://localhost:9000
mcp.server3.url=http://localhost:7777
mcp.server4.url=http://localhost:7779
mcp.trace.url=http://localhost:9005/apm
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:8888
