# Test-only endpoint values keep the Spring context independent of local containers
# and production secrets. No network requests are made while the context loads.
spring.datasource.url=jdbc:h2:mem:healops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
healops.workflow.auto-orchestrate=false
healops.diagnosis.llm-enabled=false
healops.conversation.llm-enabled=false
healops.remediation.live-adapter-enabled=false
healops.verification.stabilization-delay=PT0S
healops.sse.emitter-timeout=PT30S
healops.sse.heartbeat-enabled=false
healops.sse.heartbeat-interval=PT0S
healops.observability.live-query-enabled=false
healops.retention.enabled=false
healops.retention.dashboard-event-ttl=P7D
healops.retention.telemetry-reference-ttl=P30D
healops.retention.conversation-ttl=P30D
healops.retention.max-batch-size=500
healops.observability.prometheus-base-url=http://localhost:9090
healops.observability.loki-base-url=http://localhost:3100
healops.observability.jaeger-base-url=http://localhost:16686
mcp.server1.url=http://localhost:8000
mcp.server2.url=http://localhost:9000
mcp.server3.url=http://localhost:7777
mcp.server4.url=http://localhost:7779
mcp.trace.url=http://localhost:9005/apm
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:8888
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.tracing.sampling.probability=0.0
