
services:

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - mynetwork

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./mcp-server-promethus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - mynetwork

  docker-mcp:
    build:
      context: ./mcp_docker_server
    container_name: docker-mcp
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # REQUIRED
    networks:
      - mynetwork
    user: root
    privileged: true

  monitoring-mcp:
    build:
      context: ./mcp-server-promethus
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    ports:
      - "9001:9000"
    networks:
      - mynetwork

  k8s-mcp:
    profiles:
      - kubernetes
    build:
      context: ./mcp_k8s_server
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      KUBECONFIG: /root/.kube/config
    volumes:
      - "${USERPROFILE}/.kube/config-healops:/root/.kube/config:ro"
    ports:
      - "7777:7777"
    networks:
      - mynetwork

  openstack-mcp:
    build:
      context: ./mcp_openstack_server
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
    ports:
      - "7779:7779"
    networks:
      - mynetwork

  tracing-mcp:
    build:
      context: ./tracing_mcp
    ports:
      - "9005:9005"
    networks:
      - mynetwork

  agentservice:
    build:
      context: ./Openstack-ai-agent
    environment:
      MCP_MONITOR_URL: "http://monitoring-mcp:9000"
      MCP_K8S_URL: "http://k8s-mcp:7777"
      MCP_OPENSTACK_URL: "http://openstack-mcp:7779"
      MCP_DOCKER_URL: "http://docker-mcp:8000"
      MCP_TRACING_URL: "http://tracing-mcp:9005/apm"
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    ports:
      - "8888:8888"
    depends_on:
      - monitoring-mcp
    networks:
      - mynetwork

  agentuiservice:
    build:
      context: ./agentUI
    ports:
      - "80:80"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
