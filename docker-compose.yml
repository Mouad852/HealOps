
services:

  postgres:
    container_name: healops-postgres
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healops}
      POSTGRES_USER: ${POSTGRES_USER:-healops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - mynetwork

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.2.0
    ports:
      - "9090:9090"
    volumes:
      - ./mcp-server-promethus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - mynetwork

  jaeger:
    container_name: healops-jaeger
    image: jaegertracing/jaeger:2.2.0
    ports:
      - "16686:16686"
    networks:
      - mynetwork

  loki:
    container_name: healops-loki
    image: grafana/loki:3.4.1
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mynetwork

  otel-collector:
    container_name: healops-otel-collector
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
    depends_on:
      - jaeger
      - loki
    networks:
      - mynetwork

  docker-mcp:
    build:
      context: ./mcp_docker_server
    container_name: docker-mcp
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # REQUIRED
    networks:
      - mynetwork
    user: root
    privileged: true

  monitoring-mcp:
    build:
      context: ./mcp-server-promethus
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    ports:
      - "9001:9000"
    networks:
      - mynetwork

  k8s-mcp:
    profiles:
      - kubernetes
    build:
      context: ./mcp_k8s_server
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      KUBECONFIG: /root/.kube/config
    volumes:
      - "${USERPROFILE}/.kube/config-healops:/root/.kube/config:ro"
    ports:
      - "7777:7777"
    networks:
      - mynetwork

  openstack-mcp:
    build:
      context: ./mcp_openstack_server
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
    ports:
      - "7779:7779"
    networks:
      - mynetwork

  tracing-mcp:
    build:
      context: ./tracing_mcp
    environment:
      JAEGER_QUERY_URL: "http://jaeger:16686"
    ports:
      - "9005:9005"
    networks:
      - mynetwork

  agentservice:
    build:
      context: ./Openstack-ai-agent
    environment:
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healops}"
      POSTGRES_USER: ${POSTGRES_USER:-healops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MCP_MONITOR_URL: "http://monitoring-mcp:9000"
      MCP_K8S_URL: "http://k8s-mcp:7777"
      MCP_OPENSTACK_URL: "http://openstack-mcp:7779"
      MCP_DOCKER_URL: "http://docker-mcp:8000"
      MCP_TRACING_URL: "http://tracing-mcp:9005/apm"
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      monitoring-mcp:
        condition: service_started
    networks:
      - mynetwork

  agentuiservice:
    build:
      context: ./agentUI
    ports:
      - "80:80"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  postgres_data:
